spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: "jdbc:mysql://${MALL_TEST_MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${MALL_TEST_REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${MALL_TEST_RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/}"
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mall:
  stock-reservation:
    expire-minutes: 15
    expire-release-fixed-delay-ms: 5000
    expire-release-batch-size: 100
  # 定时任务的 @Scheduled 占位符必须在测试启动时可解析；测试中不开启热点链路。
  hot-stock-reservation:
    enabled: false
    relay-fixed-delay-millis: 200
    persistence-batch-size: 10
    reconciliation-max-reservations: 100
    reconciliation-repair-lock-ttl-millis: 30000
    timeout-release-fixed-delay-millis: 1000
  internal:
    token: ${MALL_INTERNAL_TOKEN}
  outbox:
    publish-fixed-delay-ms: 5000
    publish-batch-size: 50
    retry-delay-ms: 10000
  hot-sku-stock:
    enabled: true
    sku-ids:
      - 1
    refresh-fixed-delay-ms: 30000

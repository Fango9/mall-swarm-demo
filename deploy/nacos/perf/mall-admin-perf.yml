server:
  port: 8202

spring:
  security:
    user:
      name: ${ACTUATOR_USERNAME}
      password: ${ACTUATOR_PASSWORD}
      roles: ACTUATOR
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/}"
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-body: false
  is-read-cookie: false
  timeout: 2592000
  is-concurrent: true
  is-share: true

mall:
  stock-reservation:
    expire-minutes: 15
    expire-release-fixed-delay-ms: 5000
    expire-release-batch-size: 100
  internal:
    token: ${MALL_INTERNAL_TOKEN}
  outbox:
    publish-fixed-delay-ms: 5000
    publish-batch-size: 50
    retry-delay-ms: 10000
    # 仅 SKU 1 启用 Redis 可预占库存快速过滤。
  hot-sku-stock:
    enabled: true
    sku-ids:
      - 1
      - 30
      # PERF14 P5 专用热点下单 SKU。
      - 34
      # PERF14 P5B 多件混合下单专用热点 SKU。
      - 35
      # PERF14 P5D 重复性验证专用热点 SKU。
      - 36
      # PERF14 P5E 强度提升专用热点 SKU。
      - 37
      # PERF14 P5F 上限探测专用热点 SKU。
      - 38
      # PERF14 P5G 延迟阈值探测专用热点 SKU。
      - 39
      # PERF14 P5H 千 RPS 探测专用热点 SKU。
      - 40
    # 仅审计 Redis 键健康度，绝不以 MySQL 覆盖 Redis 预占用余额。
    audit-fixed-delay-millis: 30000
  # Redis Lua + Stream Relay 热点库存预占用；链路完整验证前保持关闭。
  hot-stock-reservation:
    enabled: false
    expire-millis: 900000
    state-retention-millis: 86400000
    relay-consumer-group: mall-hot-stock-relay
    relay-consumer-name: ${HOSTNAME:mall-admin-relay}
    relay-exchange: mall.hot-stock.reservation.exchange
    relay-routing-key: hot-stock.reservation.accepted
    relay-batch-size: 100
    persistence-batch-size: 50
    reconciliation-max-reservations: 1000
    # 仅人工调用修复接口时使用；Lua 在锁持有期间拒绝新的首次预占用。
    reconciliation-repair-lock-ttl-millis: 30000
    relay-confirm-timeout-millis: 5000
    relay-fixed-delay-millis: 200
    relay-claim-min-idle-millis: 30000
    dead-letter-retry-delay-millis: 10000
    timeout-release-batch-size: 100
    timeout-release-fixed-delay-millis: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: ${spring.application.name}
    description: mall-admin 后台管理服务
    version: 1.0.0

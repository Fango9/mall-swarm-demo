x-mall-service: &mall-service
  restart: unless-stopped
  networks:
    - mall-swarm-network

x-mall-runtime-environment: &mall-runtime-environment
  SPRING_PROFILES_ACTIVE: dev
  NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR must be set}

services:
  mall-gateway:
    <<: *mall-service
    image: cn.fango.mall/mall-gateway:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-gateway
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mall-auth:
    <<: *mall-service
    image: cn.fango.mall/mall-auth:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-auth
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8203/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mall-demo:
    <<: *mall-service
    image: cn.fango.mall/mall-demo:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-demo
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8201/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mall-monitor:
    <<: *mall-service
    image: cn.fango.mall/mall-monitor:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-monitor
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      MONITOR_USERNAME: ${MONITOR_USERNAME:?MONITOR_USERNAME must be set}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?MONITOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8206/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mall-search:
    <<: *mall-service
    image: cn.fango.mall/mall-search:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-search
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:?ELASTICSEARCH_URIS must be set}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST must be set}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT must be set}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:?RABBITMQ_VIRTUAL_HOST must be set}
      MALL_INTERNAL_TOKEN: ${MALL_INTERNAL_TOKEN:?MALL_INTERNAL_TOKEN must be set}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8205/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mall-admin:
    <<: *mall-service
    image: cn.fango.mall/mall-admin:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-admin
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST must be set}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT must be set}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:?RABBITMQ_VIRTUAL_HOST must be set}
      MALL_INTERNAL_TOKEN: ${MALL_INTERNAL_TOKEN:?MALL_INTERNAL_TOKEN must be set}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8202/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mall-portal:
    <<: *mall-service
    image: cn.fango.mall/mall-portal:${MALL_IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: mall-portal
        APP_VERSION: "1.0.0"
    environment:
      <<: *mall-runtime-environment
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST must be set}
      RABBITMQ_PORT: ${RABBITMQ_PORT:?RABBITMQ_PORT must be set}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:?RABBITMQ_VIRTUAL_HOST must be set}
      MALL_INTERNAL_TOKEN: ${MALL_INTERNAL_TOKEN:?MALL_INTERNAL_TOKEN must be set}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME:?ACTUATOR_USERNAME must be set}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD:?ACTUATOR_PASSWORD must be set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8204/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  mall-nginx:
    <<: *mall-service
    image: nginx:1.27.5-alpine
    depends_on:
      mall-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  mall-swarm-network:
    external: true
    name: mall-swarm-network